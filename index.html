<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Modpack Manager & Updater</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- JSZip for batch downloading -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #1f2937;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i data-lucide="box" class="w-8 h-8 text-emerald-500"></i>
        <h1 class="text-xl font-bold tracking-wide">ModManager <span class="text-xs px-2 py-0.5 bg-emerald-950 text-emerald-400 border border-emerald-800 rounded">v1.0</span></h1>
      </div>
      
      <!-- Tab Navigation -->
      <nav class="flex space-x-2 bg-gray-950 p-1 rounded-lg border border-gray-800">
        <button id="tab-build-btn" onclick="switchTab('build')" class="px-4 py-2 text-sm font-medium rounded-md transition-all bg-emerald-600 text-white flex items-center space-x-2">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>Build & Export</span>
        </button>
        <button id="tab-import-btn" onclick="switchTab('import')" class="px-4 py-2 text-sm font-medium rounded-md transition-all text-gray-400 hover:text-gray-200 flex items-center space-x-2">
          <i data-lucide="download-cloud" class="w-4 h-4"></i>
          <span>Import & Update</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6">
    
    <!-- TAB 1: BUILD & EXPORT -->
    <section id="tab-build" class="space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Column: Search & Add -->
        <div class="lg:col-span-2 space-y-4">
          <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 space-y-4">
            <h2 class="text-lg font-semibold flex items-center space-x-2">
              <i data-lucide="search" class="w-5 h-5 text-emerald-400"></i>
              <span>Search Modrinth</span>
            </h2>
            
            <div class="flex flex-col sm:flex-row gap-2">
              <input type="text" id="search-input" placeholder="Search mods or plugins..." onkeydown="if(event.key==='Enter') searchMods()" class="flex-1 bg-gray-950 border border-gray-800 rounded-lg px-4 py-2 focus:outline-none focus:border-emerald-500 text-sm">
              <button onclick="searchMods()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-5 py-2 rounded-lg text-sm transition flex items-center justify-center space-x-2">
                <span>Search</span>
              </button>
            </div>

            <!-- Search Results -->
            <div id="search-results" class="space-y-2 max-h-96 overflow-y-auto custom-scrollbar pr-1">
              <p class="text-xs text-gray-500 text-center py-6">Search for mods to build your list.</p>
            </div>
          </div>
        </div>

        <!-- Right Column: Pack Config & Export -->
        <div class="space-y-4">
          <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 space-y-4">
            <h2 class="text-lg font-semibold flex items-center space-x-2">
              <i data-lucide="layers" class="w-5 h-5 text-emerald-400"></i>
              <span>Your Collection</span>
            </h2>

            <div class="space-y-3 text-sm">
              <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Target Loader</label>
                <select id="export-loader" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-sm focus:outline-none focus:border-emerald-500">
                  <option value="fabric">Fabric</option>
                  <option value="forge">Forge</option>
                  <option value="neoforge">NeoForge</option>
                  <option value="paper">Paper / Spigot</option>
                  <option value="quilt">Quilt</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Target Minecraft Version</label>
                <select id="export-version" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-sm focus:outline-none focus:border-emerald-500">
                  <!-- Populated by JS -->
                </select>
              </div>
            </div>

            <hr class="border-gray-800">

            <!-- Selected Mods List -->
            <div class="space-y-2">
              <div class="flex justify-between items-center">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Added Mods (<span id="pack-count">0</span>)</span>
                <button onclick="clearCollection()" class="text-xs text-red-400 hover:text-red-300">Clear All</button>
              </div>
              <div id="selected-mods-list" class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar pr-1">
                <p class="text-xs text-gray-500 text-center py-4">No mods added yet.</p>
              </div>
            </div>

            <!-- Export Code Output -->
            <div class="space-y-2">
              <label class="block text-xs font-medium text-gray-400">Generated Share Code</label>
              <textarea id="export-code-output" readonly rows="3" placeholder="Add mods to generate share code..." class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs font-mono text-gray-300 resize-none focus:outline-none"></textarea>
            </div>

            <!-- Download / Save Actions -->
            <div class="grid grid-cols-2 gap-2">
              <button onclick="copyShareCode()" class="bg-gray-800 hover:bg-gray-700 text-xs font-medium py-2 rounded-lg transition flex items-center justify-center space-x-1">
                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                <span>Copy Code</span>
              </button>
              <button onclick="saveAsTextFile()" class="bg-gray-800 hover:bg-gray-700 text-xs font-medium py-2 rounded-lg transition flex items-center justify-center space-x-1">
                <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                <span>Save .TXT</span>
              </button>
            </div>

            <button onclick="downloadDirectFromBuild()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-sm transition flex items-center justify-center space-x-2">
              <i data-lucide="download" class="w-4 h-4"></i>
              <span>Download ZIP Directly</span>
            </button>
          </div>
        </div>

      </div>
    </section>

    <!-- TAB 2: IMPORT & UPDATE -->
    <section id="tab-import" class="hidden space-y-6">
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 space-y-6">
        <h2 class="text-lg font-semibold flex items-center space-x-2">
          <i data-lucide="upload-cloud" class="w-5 h-5 text-emerald-400"></i>
          <span>Import Code & Fetch Downloads</span>
        </h2>

        <!-- Import Form -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="md:col-span-2 space-y-2">
            <label class="block text-xs font-medium text-gray-400">Paste Code or Drop Text File</label>
            <textarea id="import-input" rows="4" placeholder="Paste formatted code or contents of share file..." class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-xs font-mono focus:outline-none focus:border-emerald-500"></textarea>
            <input type="file" id="file-upload" accept=".txt,.json" onchange="handleFileUpload(event)" class="text-xs text-gray-400">
          </div>

          <div class="space-y-4 bg-gray-950 p-4 border border-gray-800 rounded-lg">
            <h3 class="text-xs font-bold text-gray-300 uppercase tracking-wider">New Target Settings</h3>
            
            <div>
              <label class="block text-xs font-medium text-gray-400 mb-1">Target Loader</label>
              <select id="import-loader" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-sm focus:outline-none focus:border-emerald-500">
                <option value="fabric">Fabric</option>
                <option value="forge">Forge</option>
                <option value="neoforge">NeoForge</option>
                <option value="paper">Paper / Spigot</option>
                <option value="quilt">Quilt</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-medium text-gray-400 mb-1">Target Version</label>
              <select id="import-version-select" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2 text-sm focus:outline-none focus:border-emerald-500">
                <!-- Populated by JS -->
              </select>
            </div>

            <button onclick="processImportAndResolve()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg text-sm transition flex items-center justify-center space-x-2">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i>
              <span>Resolve & Fetch Mods</span>
            </button>
          </div>
        </div>

        <hr class="border-gray-800">

        <!-- Download List Results -->
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-sm font-semibold text-gray-200">Resolved Downloads</h3>
            <button id="zip-all-btn" onclick="downloadAllAsZip()" disabled class="bg-emerald-600 hover:bg-emerald-500 disabled:bg-gray-800 disabled:text-gray-500 text-white text-xs font-medium px-4 py-2 rounded-lg transition flex items-center space-x-2">
              <i data-lucide="archive" class="w-4 h-4"></i>
              <span>Download All (.ZIP)</span>
            </button>
          </div>

          <div id="resolved-list" class="space-y-2">
            <p class="text-xs text-gray-500 text-center py-6">Import a code above to resolve file links.</p>
          </div>
        </div>

      </div>
    </section>

  </main>

  <script>
    // Header required by Modrinth API guidelines to prevent request blocking on hosted domains
    const API_HEADERS = {
      'User-Agent': 'MyModpackDownloader/1.0.0 (https://github.com)'
    };

    let selectedMods = [];
    let resolvedDownloads = [];
    let mcVersionsList = [];

    const DEFAULT_MC_VERSIONS = [
      "26.3",
      "26.2", "26.2.1",
      "26.1", "26.1.1", "26.1.2",
      "1.21.4", "1.21.3", "1.21.1", "1.21", 
      "1.20.6", "1.20.4", "1.20.2", "1.20.1", "1.20",
      "1.19.4", "1.19.3", "1.19.2", "1.19.1", "1.19",
      "1.18.2", "1.18.1", "1.18",
      "1.17.1", "1.17",
      "1.16.5", "1.16.4", "1.16.3", "1.16.2", "1.16.1", "1.16",
      "1.15.2", "1.15.1", "1.15",
      "1.14.4", "1.14.3", "1.14.2", "1.14.1", "1.14",
      "1.13.2", "1.13.1", "1.13",
      "1.12.2", "1.12.1", "1.12",
      "1.11.2", "1.11",
      "1.10.2", "1.10",
      "1.9.4", "1.9",
      "1.8.9", "1.8",
      "1.7.10", "1.7.2",
      "1.6.4", "1.6.2",
      "1.5.2", "1.5.1",
      "1.4.7", "1.4.2",
      "1.3.2", "1.3.1",
      "1.2.5", "1.2.1",
      "1.1", "1.0"
    ];

    // Initialize Page
    window.onload = async function() {
      lucide.createIcons();
      await populateMinecraftVersions();
    };

    // Fetch complete list of MC versions from Mojang Manifest API
    async function populateMinecraftVersions() {
      const exportSelect = document.getElementById('export-version');
      const importSelect = document.getElementById('import-version-select');

      try {
        const res = await fetch('https://launchermeta.mojang.com/mc/game/version_manifest.json');
        if (!res.ok) throw new Error('Failed manifest fetch');
        const data = await res.json();
        
        // Extract release & snapshot versions from 1.0 upwards
        mcVersionsList = data.versions
          .map(v => v.id);
      } catch (e) {
        console.warn('Using default MC version list:', e);
        mcVersionsList = DEFAULT_MC_VERSIONS;
      }

      // Populate select dropdowns
      const optionsHtml = mcVersionsList.map(v => `<option value="${v}">${v}</option>`).join('');
      exportSelect.innerHTML = optionsHtml;
      importSelect.innerHTML = optionsHtml;

      // Default selection
      if (mcVersionsList.includes('26.3')) {
        exportSelect.value = '26.3';
        importSelect.value = '26.3';
      }
    }

    // Switch Navigation Tabs
    function switchTab(tab) {
      const buildTab = document.getElementById('tab-build');
      const importTab = document.getElementById('tab-import');
      const buildBtn = document.getElementById('tab-build-btn');
      const importBtn = document.getElementById('tab-import-btn');

      if (tab === 'build') {
        buildTab.classList.remove('hidden');
        importTab.classList.add('hidden');
        buildBtn.className = "px-4 py-2 text-sm font-medium rounded-md transition-all bg-emerald-600 text-white flex items-center space-x-2";
        importBtn.className = "px-4 py-2 text-sm font-medium rounded-md transition-all text-gray-400 hover:text-gray-200 flex items-center space-x-2";
      } else {
        importTab.classList.remove('hidden');
        buildTab.classList.add('hidden');
        importBtn.className = "px-4 py-2 text-sm font-medium rounded-md transition-all bg-emerald-600 text-white flex items-center space-x-2";
        buildBtn.className = "px-4 py-2 text-sm font-medium rounded-md transition-all text-gray-400 hover:text-gray-200 flex items-center space-x-2";
      }
    }

    // Search Modrinth REST API
    async function searchMods() {
      const query = document.getElementById('search-input').value.trim();
      const resultsContainer = document.getElementById('search-results');
      if (!query) return;

      resultsContainer.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">Searching Modrinth...</p>`;

      try {
        const res = await fetch(`https://api.modrinth.com/v2/search?query=${encodeURIComponent(query)}&limit=10`, {
          headers: API_HEADERS
        });
        if (!res.ok) throw new Error('Search request failed');
        const data = await res.json();

        if (data.hits.length === 0) {
          resultsContainer.innerHTML = `<p class="text-xs text-gray-500 text-center py-6">No mods found matching "${query}".</p>`;
          return;
        }

        resultsContainer.innerHTML = data.hits.map(mod => `
          <div class="bg-gray-950 border border-gray-800 p-3 rounded-lg flex items-center justify-between">
            <div class="flex items-center space-x-3 overflow-hidden">
              <img src="${mod.icon_url || 'https://cdn.modrinth.com/placeholder.svg'}" class="w-9 h-9 rounded bg-gray-900 object-cover shrink-0" alt="">
              <div class="truncate">
                <h4 class="text-sm font-medium text-gray-200 truncate">${mod.title}</h4>
                <p class="text-xs text-gray-500 truncate">${mod.description || 'No description'}</p>
              </div>
            </div>
            <button onclick="addMod('${mod.project_id}', '${escapeHtml(mod.title)}')" class="bg-emerald-600/20 hover:bg-emerald-600 border border-emerald-600/40 text-emerald-400 hover:text-white text-xs px-3 py-1.5 rounded transition shrink-0 ml-2">
              + Add
            </button>
          </div>
        `).join('');

      } catch (e) {
        resultsContainer.innerHTML = `<p class="text-xs text-red-400 text-center py-6">Failed to search Modrinth. Check connection or try again.</p>`;
      }
    }

    // Escape special characters in strings
    function escapeHtml(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Add Mod to Pack
    function addMod(id, title) {
      if (selectedMods.some(m => m.id === id)) return;
      selectedMods.push({ id, title });
      updateSelectedModsUI();
    }

    // Remove Mod from Pack
    function removeMod(id) {
      selectedMods = selectedMods.filter(m => m.id !== id);
      updateSelectedModsUI();
    }

    // Clear Collection
    function clearCollection() {
      selectedMods = [];
      updateSelectedModsUI();
    }

    // Update UI & Share Code Format
    function updateSelectedModsUI() {
      const list = document.getElementById('selected-mods-list');
      const count = document.getElementById('pack-count');
      const output = document.getElementById('export-code-output');

      count.textContent = selectedMods.length;

      if (selectedMods.length === 0) {
        list.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">No mods added yet.</p>`;
        output.value = '';
        return;
      }

      list.innerHTML = selectedMods.map(m => `
        <div class="flex justify-between items-center bg-gray-950 p-2 border border-gray-800 rounded text-xs">
          <span class="truncate font-medium text-gray-300">${m.title}</span>
          <button onclick="removeMod('${m.id}')" class="text-red-400 hover:text-red-300 px-1">✕</button>
        </div>
      `).join('');

      // Formatted output text string (Name:ID)
      output.value = selectedMods.map(m => `${m.title}:${m.id}`).join('\n');
    }

    // Copy Output String
    function copyShareCode() {
      const output = document.getElementById('export-code-output');
      if (!output.value) return;
      output.select();
      navigator.clipboard.writeText(output.value);
      alert('Share code copied to clipboard!');
    }

    // Save as .TXT File
    function saveAsTextFile() {
      const code = document.getElementById('export-code-output').value;
      if (!code) return;

      const blob = new Blob([code], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'modpack-list.txt';
      a.click();
      URL.revokeObjectURL(url);
    }

    // Directly Download ZIP from Build Tab
    async function downloadDirectFromBuild() {
      if (selectedMods.length === 0) {
        alert('Please add mods to your pack first!');
        return;
      }
      document.getElementById('import-input').value = document.getElementById('export-code-output').value;
      document.getElementById('import-loader').value = document.getElementById('export-loader').value;
      document.getElementById('import-version-select').value = document.getElementById('export-version').value;

      switchTab('import');
      await processImportAndResolve();
    }

    // Read Uploaded .TXT File
    function handleFileUpload(evt) {
      const file = evt.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('import-input').value = e.target.result;
      };
      reader.readAsText(file);
    }

    // Resolve Version and Fetch Direct Download Links from API
    async function processImportAndResolve() {
      const rawInput = document.getElementById('import-input').value.trim();
      const loader = document.getElementById('import-loader').value;
      const targetVersion = document.getElementById('import-version-select').value;
      const resolvedList = document.getElementById('resolved-list');
      const zipBtn = document.getElementById('zip-all-btn');

      if (!rawInput) {
        alert('Please paste or upload a share code first.');
        return;
      }

      resolvedList.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">Resolving files for ${targetVersion} (${loader})...</p>`;
      resolvedDownloads = [];
      zipBtn.disabled = true;

      // Parse lines (Formats: "Name:ID", "ID", or space/comma separated)
      const lines = rawInput.split('\n').map(l => l.trim()).filter(Boolean);
      const modIds = [];

      lines.forEach(line => {
        if (line.includes(':')) {
          const parts = line.split(':');
          modIds.push(parts[parts.length - 1].trim());
        } else {
          modIds.push(line);
        }
      });

      let itemsHtml = '';

      for (const id of modIds) {
        try {
          const versionData = await resolveModVersion(id, loader, targetVersion);
          
          if (versionData && versionData.files && versionData.files.length > 0) {
            const primaryFile = versionData.files.find(f => f.primary) || versionData.files[0];
            resolvedDownloads.push({
              filename: primaryFile.filename,
              url: primaryFile.url
            });

            itemsHtml += `
              <div class="bg-gray-950 p-3 border border-gray-800 rounded-lg flex items-center justify-between">
                <div>
                  <h4 class="text-xs font-semibold text-gray-200">${primaryFile.filename}</h4>
                  <p class="text-[10px] text-emerald-400">Compatible version found</p>
                </div>
                <a href="${primaryFile.url}" download class="bg-gray-800 hover:bg-gray-700 text-xs px-3 py-1.5 rounded text-gray-200 flex items-center space-x-1">
                  <i data-lucide="download" class="w-3 h-3"></i>
                  <span>JAR</span>
                </a>
              </div>
            `;
          } else {
            itemsHtml += `
              <div class="bg-gray-950 p-3 border border-red-900/30 rounded-lg flex items-center justify-between">
                <div>
                  <h4 class="text-xs font-semibold text-gray-400">ID: ${id}</h4>
                  <p class="text-[10px] text-red-400">Not compatible with ${targetVersion} (${loader})</p>
                </div>
              </div>
            `;
          }
        } catch (e) {
          itemsHtml += `
            <div class="bg-gray-950 p-3 border border-red-900/30 rounded-lg flex items-center justify-between">
              <div>
                <h4 class="text-xs font-semibold text-gray-400">ID: ${id}</h4>
                <p class="text-[10px] text-red-400">Failed to fetch project details</p>
              </div>
            </div>
          `;
        }
      }

      resolvedList.innerHTML = itemsHtml;
      lucide.createIcons();

      if (resolvedDownloads.length > 0) {
        zipBtn.disabled = false;
      }
    }

    // Query Modrinth Version Endpoint
    async function resolveModVersion(projectId, loader, gameVersion) {
      let url = `https://api.modrinth.com/v2/project/${projectId}/version`;
      const params = [];
      if (loader && loader !== 'any') params.push(`loaders=["${loader}"]`);
      if (gameVersion && gameVersion !== 'any') params.push(`game_versions=["${gameVersion}"]`);

      if (params.length > 0) {
        url += '?' + params.join('&');
      }

      const res = await fetch(url, { headers: API_HEADERS });
      if (!res.ok) return null;
      const versions = await res.json();
      return versions && versions.length > 0 ? versions[0] : null;
    }

    // Batch Download All Resolved Files as ZIP
    async function downloadAllAsZip() {
      if (resolvedDownloads.length === 0) return;

      const zip = new JSZip();
      const zipBtn = document.getElementById('zip-all-btn');
      zipBtn.disabled = true;
      zipBtn.innerHTML = `<span>Creating ZIP...</span>`;

      for (const item of resolvedDownloads) {
        try {
          const res = await fetch(item.url);
          const blob = await res.blob();
          zip.file(item.filename, blob);
        } catch (e) {
          console.error('Failed to add file to zip:', item.filename, e);
        }
      }

      zip.generateAsync({ type: 'blob' }).then(function(content) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = 'mods.zip';
        a.click();

        zipBtn.disabled = false;
        zipBtn.innerHTML = `<i data-lucide="archive" class="w-4 h-4"></i><span>Download All (.ZIP)</span>`;
        lucide.createIcons();
      });
    }
  </script>
</body>
</html>
